name: CI - main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_APP_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate config
        run: npm run config:validate

      - name: Run tests
        run: npm run ci:test

  release:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    steps:
      - name: Verify secrets
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "Missing EXPO_TOKEN secret"
            exit 1
          fi
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up store credentials
        run: |
          mkdir -p secrets
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > secrets/google-play-service-account.json
          printf '%s' "$ASC_API_KEY_P8" > secrets/AuthKey.p8

      - name: Build Android
        run: npx eas-cli@latest build --platform android --profile production --non-interactive

      - name: Build iOS
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive

      - name: Submit Android to Play Store
        run: npx eas-cli@latest submit --platform android --profile production --latest --non-interactive

      - name: Submit iOS to App Store
        run: >
          npx eas-cli@latest submit --platform ios --profile production --latest --non-interactive
          --asc-api-key-path ./secrets/AuthKey.p8
          --asc-api-key-id "$ASC_API_KEY_ID"
          --asc-api-key-issuer-id "$ASC_API_KEY_ISSUER_ID"
